name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run verify
      - run: npm run package:api && npm ci --omit=dev --prefix .deployment/api
      - name: Compile infrastructure and check generated templates
        run: |
          curl --fail --location --silent --show-error https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 -o /tmp/bicep
          echo 'b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  /tmp/bicep' | sha256sum --check
          chmod +x /tmp/bicep
          /tmp/bicep build infra/azuredeploy.bicep
          /tmp/bicep build infra/main.bicep
          git diff --exit-code -- infra/azuredeploy.json infra/main.json
